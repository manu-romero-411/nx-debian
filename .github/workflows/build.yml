name: Build images

# Builds the installers of the variants on a native arm64 runner, with the same
# command anyone can run by hand (nxd container build), the same way as the
# Retrobox repositories (.github/scripts, copies of theirs):
#
# * a pushed tag vX.Y or vX.Y.Z publishes the release of that tag: the
#   installers, nx-debian's packages of that version and SHA256SUMS; only vX.Y
#   and vX.Y.0 are full releases, any other vX.Y.Z is a pre-release;
# * run by hand (Actions -> Build images -> Run workflow), it only builds: the
#   installers stay as artifacts for 14 days;
# * every push to main publishes the packages alone as the continuous
#   pre-release (packages.yml).
on:
  workflow_dispatch:
    inputs:
      variant:
        description: Variant to build ("all", or one of nxd variants)
        default: all
        required: true
        type: string
      hekate:
        description: Put Hekate in the installers (by default it is not included)
        default: false
        type: boolean
      prereleases:
        description: Use the pre-releases of the Retrobox packages too (by default, only releases)
        default: false
        type: boolean
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  variants:
    name: Variants to build
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick the variants
        id: pick
        env:
          WANTED: ${{ inputs.variant || 'all' }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${EVENT}" == "push" && ! "${REF_NAME}" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Not a release tag: ${REF_NAME} (vX.Y or vX.Y.Z)" >&2
            exit 1
          fi
          all="$(./nxd variants | awk '{print $1}')"
          if [[ "${WANTED}" == "all" ]]; then
            picked="${all}"
          else
            grep -qx -- "${WANTED}" <<< "${all}" || { echo "unknown variant: ${WANTED}" >&2; exit 1; }
            picked="${WANTED}"
          fi
          echo "list=$(jq -R . <<< "${picked}" | jq -sc .)" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-24.04-arm
    needs: variants
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.variants.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # nx-debian's packages take their version from the tags
      - name: Disk space before
        run: df -h /
      - name: Build the installer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NXD_CONTAINER_ENGINE: docker
          VARIANT: ${{ matrix.variant }}
          PRERELEASES: ${{ inputs.prereleases }}
          HEKATE: ${{ inputs.hekate }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # an image built from a release tag has the packages of that version
          if [[ "${EVENT}" == "push" ]]; then
            export NXD_PACKAGE_VERSION="${REF_NAME#v}"
          fi
          args=()
          [[ "${PRERELEASES}" != "true" ]] || args+=(--prereleases)
          [[ "${HEKATE}" != "true" ]] || args+=(--require-hekate)
          sudo -E ./nxd container build --variant "${VARIANT}" --clean --dist dist "${args[@]}"
      - name: Disk space after
        if: always()
        run: df -h /
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.variant }}
          path: dist/
          if-no-files-found: error
          compression-level: 0 # the installers are zips already
          retention-days: 14

  release:
    name: Publish the release
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name == 'push'
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # nx-debian's packages take their version from the tags
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
          path: dist
      - name: nx-debian's packages of that version (for nxd-update)
        env:
          TAG: ${{ github.ref_name }}
        run: ./nxd debs --version "${TAG#v}" dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # only vX.Y and vX.Y.0 are full releases
          flags=()
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+(\.0)?$ ]] || flags+=(--prerelease)
          .github/scripts/publish-release.sh tag "${TAG}" dist "${flags[@]}"
