name: Packages

# nx-debian's own packages (nxd-common, nxd-<variant>; `nxd debs`) on every push
# to main, published as the "nxd-latest" pre-release, whose files are replaced
# each time (the release itself stays, so that it is always there): the consoles get them with `nxd-update --allow-prereleases`. Releases
# (a v* tag, build.yml) carry the packages of their version, and are what
# `nxd-update` takes by default.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages
  cancel-in-progress: false

jobs:
  packages:
    name: Build and publish the packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version is worked out from the tags
      - name: Build
        run: |
          ./nxd debs dist
          cd dist
          sha256sum -- *.deb > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Publish the nxd-latest pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(./nxd debs --print-version)"
          title="nx-debian packages ${version} (pre-release)"
          notes="nxd-common and nxd-<variant> ${version}, built from ${GITHUB_SHA}. Updated on every push to main. On a console: \`nxd-update --allow-prereleases\`."
          if ! gh release view nxd-latest > /dev/null 2>&1; then
            gh release create nxd-latest dist/* --prerelease --latest=false \
              --target "${GITHUB_SHA}" --title "${title}" --notes "${notes}"
            exit 0
          fi
          # The release is never deleted, so that a console updating meanwhile
          # always finds one: the tag moves, the new packages go in, then
          # SHA256SUMS (until then nxd-update skips them), then the old ones go.
          git tag -f nxd-latest "${GITHUB_SHA}"
          git push -f origin refs/tags/nxd-latest
          old="$(gh release view nxd-latest --json assets --jq '.assets[].name')"
          gh release upload nxd-latest dist/*.deb --clobber
          gh release upload nxd-latest dist/SHA256SUMS --clobber
          for asset in ${old}; do
            [[ -e "dist/${asset}" ]] || gh release delete-asset nxd-latest "${asset}" --yes
          done
          gh release edit nxd-latest --prerelease --latest=false --title "${title}" --notes "${notes}"
