name: Packages

# nx-debian's own packages (nxd-common, nxd-<variant>; `nxd debs`), the same
# way as the Retrobox repositories (.github/scripts, copies of theirs):
#
# * a push to main publishes the continuous pre-release (tag "continuous", made
#   again on each push): version <last release>.<UTC time>, which installs over
#   the last release and over the previous build; the consoles get it with
#   `nxd-update --allow-prereleases`;
# * a v* tag publishes a release (build.yml: the installers and the packages of
#   its version), which is what `nxd-update` takes by default;
# * run by hand, it only builds.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages
  cancel-in-progress: false

jobs:
  packages:
    name: Build the packages
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version is worked out from the tags
      - name: Choose the version
        id: version
        run: echo "version=$(.github/scripts/continuous-version.sh)" >> "${GITHUB_OUTPUT}"
      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./nxd debs --version "${VERSION}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish the continuous pre-release
    if: github.event_name == 'push'
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      # the pre-release of the earlier scheme, whose files were replaced on
      # each push: "continuous" takes its place
      - name: Retire nxd-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete nxd-latest --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes 2> /dev/null || true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.packages.outputs.version }}
          UPDATE_COMMAND: nxd-update
        run: .github/scripts/publish-release.sh continuous dist "${VERSION}"
