# Moonlight for Linux4Tegra (moonlight-qt with the Tegra hardware decoder), the
# Moonlight project's repository for the Switch and the Jetson boards, hosted
# by Cloudsmith: https://github.com/moonlight-stream/moonlight-docs/wiki/Installing-Moonlight-Qt-on-Linux4Tegra-(L4T)-Ubuntu
#
# It is built for L4T Ubuntu only (18.04, 22.04 and 24.04): its setup.deb.sh,
# the documented way to add it, asks for the running distribution and has
# nothing for Debian. So the source is written here, for Ubuntu 24.04 (noble):
# its moonlight-qt depends on the t64 libraries and Qt 5.15 (GLES) that
# Debian 13 has too (`nxd spike` shows whether it resolves).
#
# The key is kept in git (config/keys) and checked against the fingerprint
# below before every build; to refresh it:
#   curl -1sLf "$REPO_KEY_URL" -o config/keys/moonlight-l4t.asc
REPO_URL="https://dl.cloudsmith.io/public/moonlight-game-streaming/moonlight-l4t/deb/ubuntu"
REPO_SUITE="noble"
REPO_COMPONENTS="main"
REPO_KEY="moonlight-l4t.asc"
REPO_KEY_FPR="6F916306EA1CC7D5791202BA75B5C67A010F2EA5"
REPO_KEY_URL="https://dl.cloudsmith.io/public/moonlight-game-streaming/moonlight-l4t/gpg.75B5C67A010F2EA5.key"
REPO_LIST="moonlight"
