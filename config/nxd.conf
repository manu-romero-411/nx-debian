# nxd settings. Plain shell: every value can be overridden from the
# environment (NXD_SUITE=forky ./nxd rootfs ...).

# Debian
NXD_SUITE="${NXD_SUITE:-trixie}"
NXD_ARCH="${NXD_ARCH:-arm64}"
NXD_MIRROR="${NXD_MIRROR:-http://deb.debian.org/debian}"
NXD_COMPONENTS="${NXD_COMPONENTS:-main}"

# The L4T repository (NVIDIA Tegra userspace, the Switch's BSP packages and
# the Xorg 1.20 build the Tegra driver needs). The component is the Ubuntu
# release the packages were built for; which one resolves on Debian is what
# `nxd spike` is for, so the default is NOT validated yet.
NXD_L4T_URL="${NXD_L4T_URL:-https://theofficialgman.github.io/l4t-debs/}"
NXD_L4T_SUITE="${NXD_L4T_SUITE:-l4t}"
NXD_L4T_COMPONENT="${NXD_L4T_COMPONENT:-noble}"
# Public key of the repository, kept in git and checked against this
# fingerprint before every use (never fetched at build time).
NXD_L4T_KEY="${NXD_L4T_KEY:-${NXD_CONFIG_DIR}/keys/theofficialgman-L4T.asc}"
NXD_L4T_KEY_FPR="${NXD_L4T_KEY_FPR:-1B920C89A4283780164AE26773A65EDFE6C919A5}"

# Where `nxd rootfs` writes (one directory per variant).
NXD_OUTPUT_DIR="${NXD_OUTPUT_DIR:-${NXD_ROOT}/build_output}"
