# Retrobox in this image (see config/hooks/retrobox/ and nxd-sdcard).

[paths]
# ROMs, BIOS and saves are in the FAT32 partition of the SD card, which
# nxd-sdcard.service mounts in /sdcard (the one hekate and the other systems of
# the card use too). The rest (configuration, state, themes, bezels, shaders,
# emulators) is in the home of the user, where Retrobox puts it by default.
roms_dir = /sdcard/retrobox/roms
saves_dir = /sdcard/retrobox/saves
bios_dir = /sdcard/retrobox/bios

[core]
# A console, not a program: EmulationStation cannot be quit (QUIT opens the
# restart / suspend / shut down menu instead), not even with Alt+F4.
console_mode = true
