# Retrobox in this image (see config/hooks/retrobox/).

[paths]
# Where it keeps everything it has: ROMs, saves, BIOS, themes, emulators.
data_dir = /retrobox
# Its logs (/retrobox/logs) and what it records about installs. The
# configuration is /retrobox/config, but that one cannot be set here: it is
# where this file is looked for, so it comes from RETROBOX_CONFIGDIR (see
# etc/environment.d, etc/X11/Xsession.d and etc/profile.d of the overlay).
state_dir = /retrobox

[core]
# A console, not a program: EmulationStation cannot be quit (QUIT opens the
# restart / suspend / shut down menu instead), not even with Alt+F4.
console_mode = true
