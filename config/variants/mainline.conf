# Experimental: the open graphics stack (mainline kernel, nouveau + tegra in
# Mesa) instead of the L4T kernel and NVIDIA's driver. Only the rootfs builds
# for now; there is no boot path yet. See docs/mainline.md.
NXD_VARIANT_DESCRIPTION="Mainline kernel and Mesa (rootfs only, no boot path yet)"
NXD_EXPERIMENTAL=1

# No L4T repository: Debian alone. The firmware the kernel loads (GM20B, VIC,
# XUSB, the Broadcom Wi-Fi/Bluetooth chip) is in non-free-firmware.
NXD_L4T=0
NXD_COMPONENTS="main non-free-firmware"
NXD_VARIANT_LISTS="base kernel-debian mesa x11 xorg-debian xfce-core xfce"

NXD_AUTOLOGIN_SESSION="xfce"
NXD_DEFAULT_USER="switch"
NXD_DEFAULT_PASSWORD="switch"
NXD_DISABLE_UNITS="ssh.service ssh.socket"
