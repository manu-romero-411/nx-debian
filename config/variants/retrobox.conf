# Image for Retrobox: Xorg, Openbox on lightdm, and the Retrobox packages.
NXD_VARIANT_DESCRIPTION="Retrobox: Openbox on lightdm with the Retrobox packages"
NXD_VARIANT_LISTS="base l4t x11 retrobox"

# The account of the image (uid 1000), logged in by lightdm into Openbox. It is
# public by design, like the one of any console image; `nxd rootfs --user NAME`
# replaces it and --no-user drops it.
NXD_DEFAULT_USER="retrobox"
NXD_DEFAULT_PASSWORD="retrobox"
NXD_AUTOLOGIN_SESSION="openbox"

# Installed from the GitHub releases of the project (config/releases/retrobox.list).
NXD_RELEASE_LIST="retrobox"

# ROMs, saves and BIOS are in the SD card's FAT32 partition (nxd-sdcard, in
# config/overlay/retrobox); the rest of what Retrobox keeps is in the home of
# the user. The content Retrobox downloads on its first start is put in the
# image instead,
# so the first start has nothing to wait for; `nxd rootfs --no-preload` skips it.
NXD_PRELOAD="theme bezels shaders"

# Emulators installed in the image with Retrobox's own installers
# (/opt/retrobox/tools/emulators/NAME.sh, as the user of the image, into
# ~/.local/share/retrobox/emulators). RetroArch on aarch64 is the buildbot's binary plus the
# base cores (retrobox.cores.BASE_CORES) and its assets; flycast is built from
# source, with the build tools installed for it and purged afterwards. The
# other cores are downloaded on demand from RetroArch or EmulationStation.
# `nxd rootfs --no-preload` skips this too.
NXD_EMULATORS="retroarch"

# Not shipped: kernel headers (switch-bsp carries 64 MiB of them), man pages,
# info pages and package docs (the copyright files stay, as Debian policy
# asks). Locales are kept. Neither the Xorg configuration that makes a gamepad
# a mouse, whatever package brings it: in this image the pad is always a gamepad.
NXD_PATH_EXCLUDES="/usr/src/linux-headers-* /usr/share/man/* /usr/share/info/* /usr/share/doc/* /usr/share/X11/xorg.conf.d/*joystick*.conf"
NXD_PATH_INCLUDES="/usr/share/doc/*/copyright"

# Units that do nothing useful on a console: the image is updated by hand.
# (NetworkManager, bluez and the audio daemons stay: Retrobox drives them.)
NXD_MASK_UNITS="apt-daily.timer apt-daily-upgrade.timer apt-daily.service apt-daily-upgrade.service"
# ssh is on (the image is a console you reach from a computer to work on it).
# The account has a known password: change it, or build with `--user` and
# `--password-hash`, before the console is on a network you do not trust. The
# xfce variant keeps ssh off.
NXD_DISABLE_UNITS=""
