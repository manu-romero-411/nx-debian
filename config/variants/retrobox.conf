# Minimal image for Retrobox: Xorg, the XFCE session core and Openbox.
NXD_VARIANT_DESCRIPTION="Minimal base for Retrobox: XFCE session core and Openbox"
NXD_VARIANT_LISTS="base l4t x11 xfce-core retrobox"
# lightdm logs the first user (--user) straight into this session; Retrobox
# starts from there, and brings the panel and the desktop up when it exits.
NXD_AUTOLOGIN_SESSION="xfce"
# Not shipped: kernel headers (switch-bsp carries 64 MiB of them), man pages,
# info pages and package docs (the copyright files stay, as Debian policy
# asks). Locales are kept.
NXD_PATH_EXCLUDES="/usr/src/linux-headers-* /usr/share/man/* /usr/share/info/* /usr/share/doc/*"
NXD_PATH_INCLUDES="/usr/share/doc/*/copyright"
# Units that do nothing useful on a console: the image is updated by hand.
# (NetworkManager, bluez and the audio daemons stay: Retrobox drives them.)
NXD_MASK_UNITS="apt-daily.timer apt-daily-upgrade.timer apt-daily.service apt-daily-upgrade.service"
