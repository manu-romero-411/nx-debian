# Image for Retrobox: Xorg, Openbox on lightdm, and the Retrobox packages.
NXD_VARIANT_DESCRIPTION="Retrobox: Openbox on lightdm with the Retrobox packages"
NXD_VARIANT_LISTS="base l4t x11 retrobox"

# The account of the image (uid 1000), logged in by lightdm into Openbox. It is
# public by design, like the one of any console image; `nxd rootfs --user NAME`
# replaces it and --no-user drops it.
NXD_DEFAULT_USER="retrobox"
NXD_DEFAULT_PASSWORD="retrobox"
NXD_AUTOLOGIN_SESSION="openbox"

# Installed from the GitHub releases of the project (config/releases/retrobox.list).
NXD_RELEASE_LIST="retrobox"

# Not shipped: kernel headers (switch-bsp carries 64 MiB of them), man pages,
# info pages and package docs (the copyright files stay, as Debian policy
# asks). Locales are kept.
NXD_PATH_EXCLUDES="/usr/src/linux-headers-* /usr/share/man/* /usr/share/info/* /usr/share/doc/*"
NXD_PATH_INCLUDES="/usr/share/doc/*/copyright"

# Units that do nothing useful on a console: the image is updated by hand.
# (NetworkManager, bluez and the audio daemons stay: Retrobox drives them.)
NXD_MASK_UNITS="apt-daily.timer apt-daily-upgrade.timer apt-daily.service apt-daily-upgrade.service"
# The account has a known password, so ssh is installed but not started:
# `sudo systemctl enable --now ssh` turns it on.
NXD_DISABLE_UNITS="ssh.service ssh.socket"
