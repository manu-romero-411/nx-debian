# Desktop image: XFCE with the Switchroot defaults.
NXD_VARIANT_DESCRIPTION="XFCE desktop"
NXD_VARIANT_LISTS="base l4t x11 joystick xfce-core xfce"
# lightdm logs the first user in (--user) straight into this session.
NXD_AUTOLOGIN_SESSION="xfce"

# A public account, as the images are published: log in as switch / switch.
# A build at a terminal asks for the user name and the password instead (Enter
# keeps these); one without a terminal (the CI) uses them as they are.
NXD_PROMPT_USER=1
NXD_DEFAULT_USER="switch"
NXD_DEFAULT_PASSWORD="switch"
# ssh is installed but off while the password is a known one;
# systemctl enable --now ssh turns it on.
NXD_DISABLE_UNITS="ssh.service ssh.socket"
