; Retrobox's overlay in this image (nxd-retrobox): what differs from its
; defaults (/usr/share/doc/retrobox-overlay/overlay.ini.example). A user's
; ~/.config/retrobox/overlay.ini wins, key by key.

[volume]
; the volume buttons (retrobox-volume, bound in the session's Openbox) show the
; volume at the top of the screen
toast = true
