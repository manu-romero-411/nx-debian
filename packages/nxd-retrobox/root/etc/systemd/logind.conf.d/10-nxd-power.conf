# The power button of the console. In the Retrobox session it is
# /usr/share/nxd/retrobox/power-button's (a tap suspends, holding it a second
# opens the overlay's power options): it takes a handle-power-key inhibitor,
# which logind respects (PowerKeyIgnoreInhibited=no). Without it (a text
# console, the session down), logind does it: a tap suspends, holding it five
# seconds powers the console off.
[Login]
HandlePowerKey=suspend
PowerKeyIgnoreInhibited=no
HandlePowerKeyLongPress=poweroff
