# The power button of the console. The Switch's is a suspend key to the
# kernel (KEY_SUSPEND), so both kinds of key are set the same way. In the
# Retrobox session the button is /usr/share/nxd/retrobox/power-button's (a tap
# suspends, holding it a second opens the overlay's power options): it takes
# a handle-power-key and handle-suspend-key inhibitor, which logind respects
# (*IgnoreInhibited=no). Without it (a text console, the session down),
# logind does it: a tap suspends, holding it five seconds powers the console
# off.
[Login]
HandlePowerKey=suspend
PowerKeyIgnoreInhibited=no
HandlePowerKeyLongPress=poweroff
HandleSuspendKey=suspend
SuspendKeyIgnoreInhibited=no
HandleSuspendKeyLongPress=poweroff
